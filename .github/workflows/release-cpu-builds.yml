name: Release CPU builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing Git tag to publish, for example v3.4-udp1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.cpu_level }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu_level: x86-64-v1
            march: x86-64
          - cpu_level: x86-64-v2
            march: x86-64-v2
          - cpu_level: x86-64-v3
            march: x86-64-v3
          - cpu_level: x86-64-v4
            march: x86-64-v4

    steps:
      - uses: actions/checkout@v6
        with:
          # manual runs must build the tag being published, not the default branch
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Build HAProxy static binary with musl
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            alpine:3.20 \
            sh -euxc '
              apk add --no-cache \
                build-base \
                ca-certificates \
                linux-headers \
                openssl-dev \
                openssl-libs-static \
                pcre2-dev \
                zlib-dev \
                zlib-static

              for lib in libpcre2-8.a libssl.a libcrypto.a libz.a; do
                path="$(gcc -print-file-name="$lib")"
                test "$path" != "$lib"
                test -f "$path"
                echo "$lib -> $path"
              done

              make clean
              make -j"$(nproc)" TARGET=linux-musl \
                USE_OPENSSL=1 USE_ZLIB=1 USE_PCRE2=1 USE_PCRE2_JIT=1 USE_THREAD=1 \
                USE_DL= USE_RT= USE_LIBCRYPT= \
                OPT_CFLAGS="-O3 -flto=auto" \
                CPU_CFLAGS="-march=${{ matrix.march }} -mtune=generic" \
                LDFLAGS="-static -flto=auto"
            '

      - name: Verify static binary
        run: |
          set -eu
          file haproxy
          if ldd haproxy 2>&1 | grep -q "not a dynamic executable"; then
            if readelf -l haproxy | grep -q "Requesting program interpreter"; then
              echo "haproxy still has a dynamic interpreter"
              readelf -l haproxy
              exit 1
            fi
            exit 0
          fi
          echo "haproxy is not fully static"
          ldd haproxy || true
          exit 1

      - name: Package
        run: |
          set -eu
          out="haproxy-linux-static-${{ matrix.cpu_level }}"
          mkdir -p "dist/${out}"
          cp haproxy "dist/${out}/haproxy"
          strip "dist/${out}/haproxy"
          cat > "dist/${out}/README.txt" <<EOF
          HAProxy Linux x86-64 fully static build
          CPU level: ${{ matrix.cpu_level }}
          Compiler flags: -march=${{ matrix.march }} -mtune=generic -O3 -flto=auto -static
          Link mode: fully static musl
          PCRE2: linked statically by the global -static linker mode

          x86-64-v1: baseline x86-64
          x86-64-v2: SSE3/SSSE3/SSE4.x/POPCNT/CX16/LAHF-SAHF
          x86-64-v3: AVX/AVX2/BMI/F16C/FMA/MOVBE/XSAVE/LZCNT-or-ABM
          x86-64-v4: AVX-512F/BW/CD/DQ/VL
          EOF
          tar -C dist -czf "dist/${out}.tar.gz" "${out}"
          sha256sum "dist/${out}.tar.gz" > "dist/${out}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: haproxy-linux-static-${{ matrix.cpu_level }}
          path: |
            dist/haproxy-linux-static-${{ matrix.cpu_level }}.tar.gz
            dist/haproxy-linux-static-${{ matrix.cpu_level }}.tar.gz.sha256

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          # full history and tags, to list the changes since the previous release
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.release_tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          git fetch --force --tags origin
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
          {
            if [ -n "$prev" ]; then
              echo "## Changes since ${prev}"
              range="${prev}..${TAG}"
            else
              echo "## Changes"
              range="${TAG}"
            fi
            echo
            # one section per commit: subject as title, body as details
            git log --no-merges --format='### %s%n%n%b%n' "$range"               | grep -v -i '^Co-Authored-By:'               | cat -s
            echo
            echo "---"
            echo "HAProxy version: $(cat VERSION) (based on upstream HAProxy $(cut -d. -f1-3 VERSION))"
            echo
            echo "Fully static Linux x86-64 HAProxy builds (musl) for x86-64-v1/v2/v3/v4:"
            echo "- x86-64-v1: baseline x86-64"
            echo "- x86-64-v2: SSE3/SSSE3/SSE4.x/POPCNT/CX16"
            echo "- x86-64-v3: AVX/AVX2/BMI/FMA/MOVBE"
            echo "- x86-64-v4: AVX-512"
          } > release-notes.md
          cat release-notes.md

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          find dist -maxdepth 1 -type f -print | sort
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" dist/*               --verify-tag               --title "$TAG"               --notes-file release-notes.md
          fi
